<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpIOVI52VNw3goax4z00Tj_4QnRsbE8XO5rQgKZ4O04EcwQtNd8u77HAAfoO7ZGY8F03Xtpkh6VzeP/pub?output=csv";

function todayISO() {
  return new Date().toISOString().split("T")[0];
}

function normalizeDate(dateStr) {
  if (!dateStr) return "";
  if (dateStr.includes("-")) return dateStr;
  const [m, d, y] = dateStr.split("/");
  return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
}

function parseCSV(csv) {
  return csv.trim().split("\n").slice(1).map(line => {
    const [date, parking, note] = line.split(",");
    return {
      date: (date || "").trim(),
      parking: (parking || "").trim().toUpperCase(),
      note: (note || "").trim()
    };
  });
}

// SAFE: render something immediately so no white screen ever happens
function render(status, note = "") {
  const statusEl = document.getElementById("status");
  const noteEl = document.getElementById("note");

  if (!statusEl || !noteEl) return;

  statusEl.textContent = status;

  if (status === "YES") {
    statusEl.className = "status yes";
    document.body.style.background = "#ecfdf5";
  } else if (status === "NO") {
    statusEl.className = "status no";
    document.body.style.background = "#fef2f2";
  } else {
    statusEl.className = "status";
  }

  noteEl.textContent = note;
}

async function load() {
  // fallback UI immediately
  render("LOADING...", "Checking parking status...");

  try {
    const res = await fetch(SHEET_CSV_URL);
    const csv = await res.text();

    const rows = parseCSV(csv);
    const today = todayISO();

    const match = rows.find(r => normalizeDate(r.date) === today);

    if (!match) {
      render("NO DATA", "No entry found for today");
      return;
    }

    render(match.parking, match.note);

  } catch (err) {
    console.error(err);
    render("ERROR", "Could not load data");
  }
}

load();
</script>
