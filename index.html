<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Can We Park Today?</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial;
      background: #f4f4f5;
    }
    
    .container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 360px;
    }

    .title {
      font-size: 14px;
      letter-spacing: 2px;
      color: #666;
      margin-bottom: 6px;
    }
    
    .date-picker {
      margin-bottom: 16px;
    }

    input[type="date"] {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-family: inherit;
    }

.status {
  font-size: 96px;
  font-weight: 900;
  letter-spacing: 2px;
  min-width: 220px;
  text-align: center;
  opacity: 1;
  transform: scale(1);
  filter: blur(0px);
 transition: opacity 160ms ease, transform 160ms ease, color 0ms, filter 160ms ease;
  will-change: transform, opacity, filter;
}

.yes { color: #15803d; }
.no { color: #b91c1c; }

   .status-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
}

#prevDayBtn,
#nextDayBtn {
  font-size: 28px;
  font-weight: bold;
  border: none;
  background: transparent;
  cursor: pointer;
  color: #888;
  padding: 4px 8px;
  transition: transform 0.1s ease, color 0.2s ease;
  width: 40px;
}

#prevDayBtn:hover,
#nextDayBtn:hover {
  color: #111;
  transform: scale(1.2);
}
    
    .divider {
  width: 60%;
  height: 1px;
  background: #e5e7eb;
  margin: 10px auto 18px auto;
}
    .note {
      margin-top: 8px;
      color: #444;
      font-size: 14px;
      min-height: 20px;
    }

    .updated {
      margin-top: 18px;
      font-size: 11px;
      color: #999;
    }
    
    .disclaimer {
  font-size: 10px;
  color: #999;
  text-align: center;
  margin-top: 10px;
  padding: 0 10px;
}

.weather-content {
  max-width: 420px;
  margin: 60px auto 40px auto;
  font-size: 13px;
  color: #444;
  text-align: center;
  line-height: 1.5;
}
  </style>
</head>

<body>
  <div class="container">

    <div class="card">
     <div id="title" class="title">CAN WE PARK TODAY?</div>
      <div class="divider"></div>
      <div class="date-picker">
        <input type="date" id="dateInput"/>
      </div>

      <div class="status-row">
  <button id="prevDayBtn" onclick="prevDay()">‹</button>
  <div id="status" class="status">...</div>
  <button id="nextDayBtn" onclick="nextDay()">›</button>
</div>
      <div id="note" class="note"></div>
      <div id="updated" class="updated"></div>
    </div>

    <div class="disclaimer">
      *This website does not guarantee parking. Choosing a future date increases the chance of errors.*
    </div>

<div class="weather-content">
  <strong>☔🥸 Weatherman Ross Here 🥸☔</strong>
  <div id="weatherContent">
    (Loading weather thoughts...)
  </div>
</div>

  </div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpIOVI52VNw3goax4z00Tj_4QnRsbE8XO5rQgKZ4O04EcwQtNd8u77HAAfoO7ZGY8F03Xtpkh6VzeP/pub?output=csv";

let cachedData = [];

function formatDate(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function today() {
  const d = new Date();
  return d.toLocaleDateString("en-CA"); // ISO-safe local format
}
function prevDay() {
  const dateInput = document.getElementById("dateInput");

  const current = new Date(dateInput.value);
  current.setDate(current.getDate() - 1);

  const newDate = current.toISOString().slice(0, 10);

  dateInput.value = newDate;

  updateTitle(newDate);
  getForDate(newDate);
}
function nextDay() {
  const dateInput = document.getElementById("dateInput");

  const current = new Date(dateInput.value);
  current.setDate(current.getDate() + 1);

  const newDate = current.toISOString().slice(0, 10);

  dateInput.value = newDate;

  updateTitle(newDate);
  getForDate(newDate);
}
  
function updateTitle(dateStr) {
  const titleEl = document.getElementById("title");

  // Get today in the SAME format as input (YYYY-MM-DD)
  const todayStr = today();

  // Convert both to "day numbers" safely (no timezone issues)
  const todayParts = todayStr.split("-");
  const selectedParts = dateStr.split("-");

  const todayDate = new Date(todayParts[0], todayParts[1] - 1, todayParts[2]);
  const selectedDate = new Date(selectedParts[0], selectedParts[1] - 1, selectedParts[2]);

  const diffDays = Math.round((selectedDate - todayDate) / (1000 * 60 * 60 * 24));

  if (diffDays === 0) {
    titleEl.textContent = "CAN WE PARK TODAY?";
  } else if (diffDays === 1) {
    titleEl.textContent = "CAN WE PARK TOMORROW?";
  } else if (diffDays === 2) {
    titleEl.textContent = "CAN WE PARK THE DAY AFTER TOMORROW?";
  } else if (diffDays > 2) {
    titleEl.textContent = "CAN WE PARK SOME OTHER DAY?";
  } else {
    titleEl.textContent = "COULD WE PARK IN THE PAST?";
  }
}
  
function render(status, note) {
  const statusEl = document.getElementById("status");
  const noteEl = document.getElementById("note");
  const updatedEl = document.getElementById("updated");

 statusEl.style.opacity = 0;
statusEl.style.transform = "scale(0.98)";
statusEl.style.filter = "blur(2px)";

setTimeout(() => {
  // 1. set text + class FIRST (while still hidden)
  statusEl.textContent = status;

  if (status === "YES") {
    statusEl.className = "status yes";
    document.body.style.background = "rgba(22, 163, 74, 0.08)";
  } else if (status === "NO") {
    statusEl.className = "status no";
    document.body.style.background = "rgba(220, 38, 38, 0.08)";
  } else {
    statusEl.className = "status";
    document.body.style.background = "#f4f4f5";
  }

  // 2. force browser to apply class BEFORE fade-in
  requestAnimationFrame(() => {
    statusEl.style.opacity = 1;
    statusEl.style.transform = "scale(1)";
    statusEl.style.filter = "blur(0px)";
  });

}, 120);

  noteEl.textContent = note || "";
  updatedEl.textContent = "Last checked: " + new Date().toLocaleTimeString();
}

function parse(csv) {
  const rows = [];
  let current = "";
  let inQuotes = false;

  // Step 1: split into proper rows
  for (let i = 0; i < csv.length; i++) {
    const char = csv[i];

    if (char === '"') {
      inQuotes = !inQuotes;
    }

    if (char === '\n' && !inQuotes) {
      rows.push(current);
      current = "";
    } else {
      current += char;
    }
  }

  if (current) rows.push(current);

  // Step 2: parse columns
  return rows.slice(1).map(row => {
    const cols = [];
    let value = "";
    let inQuotes = false;

    for (let i = 0; i < row.length; i++) {
      const char = row[i];

      if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        cols.push(value);
        value = "";
      } else {
        value += char;
      }
    }

    cols.push(value);

    const [date, parking, note, weather] = cols;

    return {
      date: date?.trim(),
      parking: parking?.trim(),
      note: note?.trim(),
      weather: weather?.trim()
    };
  });
}

function getForDate(dateStr) {
  const match = cachedData.find(r => r.date === dateStr);
  const weatherEl = document.getElementById("weatherContent");

  if (!match) {
    render("NO DATA", "Ain't no way you actually need to know if there's parking on this day =P");
    weatherEl.textContent = "I haven't written the weather update yet!";
    return;
  }

  render(match.parking, match.note);

  if (match.weather) {
  weatherEl.innerHTML = match.weather.replace(/\r?\n/g, "<br><br>");
  } else {
    weatherEl.textContent = "I haven't written the weather update yet!";
  }
}
async function load() {
  try {
    const cached = localStorage.getItem("parkingCSV");
const cachedTime = localStorage.getItem("parkingCSVTime");
const FIVE_MIN = 5 * 60 * 1000;

if (cached && cachedTime && (Date.now() - cachedTime < FIVE_MIN)) {
  cachedData = parse(cached);

  const dateInput = document.getElementById("dateInput");
  dateInput.value = today();
  updateTitle(dateInput.value);
  getForDate(dateInput.value);

  console.log("Loaded from short-term cache");
  return;
}
    render(". . .", "");

    const res = await fetch(SHEET_URL);
    const csv = await res.text();
    localStorage.setItem("parkingCSV", csv);
    cachedData = parse(csv);

    const dateInput = document.getElementById("dateInput");

   dateInput.value = today();
updateTitle(dateInput.value);
getForDate(dateInput.value);

    dateInput.addEventListener("change", (e) => {
      updateTitle(e.target.value);
      getForDate(e.target.value);
    });
    
} catch (e) {
  console.error(e);

  const cached = localStorage.getItem("parkingCSV");

  if (cached) {
    cachedData = parse(cached);

    const dateInput = document.getElementById("dateInput");

  dateInput.value = today();
updateTitle(dateInput.value);
getForDate(dateInput.value);
    console.log("Loaded from cache");
  } else {
    render("ERROR", "Could not load data.");
  }
}
}
load();
</script>

</body>
</html>
