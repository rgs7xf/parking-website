<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Can We Park Today?</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f4f4f5;
    }

    .card {
      text-align: center;
      padding: 48px 40px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 360px;
    }

    .title {
      font-size: 14px;
      letter-spacing: 2px;
      color: #666;
      margin-bottom: 6px;
    }

    .date-picker {
      margin-bottom: 16px;
    }

    input[type="date"] {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-family: inherit;
    }

.status {
  font-size: 96px;
  font-weight: 900;
  letter-spacing: 2px;
  transition: opacity 0.3s ease;
}

.yes { color: #15803d; }
.no { color: #b91c1c; }

    .divider {
  width: 60%;
  height: 1px;
  background: #e5e7eb;
  margin: 10px auto 18px auto;
}
    .note {
      margin-top: 8px;
      color: #444;
      font-size: 14px;
      min-height: 20px;
    }

    .updated {
      margin-top: 18px;
      font-size: 11px;
      color: #999;
    }
    
    .disclaimer {
  font-size: 10px;
  color: #999;
  text-align: center;
  margin-top: 10px;
  padding: 0 10px;
}
    .weather-toggle {
  margin-top: 20px;
  font-size: 14px;
  color: #2563eb;
  cursor: pointer;
  text-align: center;
  transition: opacity 0.2s ease;
}

.weather-toggle:hover {
   text-decoration: underline;
  opacity: 0.7;
}

.weather-content {
  max-width: 420px;
  margin: 10px auto 0;
  font-size: 13px;
  color: #444;
  text-align: center;
  line-height: 1.5;

  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.4s ease, opacity 0.3s ease;
}
  </style>
</head>

<body>
  <div class="container">

    <div class="card">
      <div class="title">CAN WE PARK TODAY?</div>
      <div class="divider"></div>
      <div class="date-picker">
        <input type="date" id="dateInput"/>
      </div>

      <div id="status" class="status">...</div>
      <div id="note" class="note"></div>
      <div id="updated" class="updated"></div>
    </div>

    <div class="disclaimer">
      *This website does not guarantee parking. Choosing a future date increases the chance of errors.*
    </div>
    
    <div class="weather-toggle" onclick="toggleWeather()">
  ☔🥸 Weatherman Ross Here 🥸☔
</div>

<div id="weatherContent" class="weather-content">
  (Loading weather thoughts...)
</div>

  </div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpIOVI52VNw3goax4z00Tj_4QnRsbE8XO5rQgKZ4O04EcwQtNd8u77HAAfoO7ZGY8F03Xtpkh6VzeP/pub?output=csv";

let cachedData = [];

function formatDate(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function today() {
  return formatDate(new Date());
}

function render(status, note) {
  const statusEl = document.getElementById("status");
  const noteEl = document.getElementById("note");
  const updatedEl = document.getElementById("updated");

  statusEl.textContent = status;

  if (status === "YES") {
    statusEl.className = "status yes";
    document.body.style.background = "rgba(22, 163, 74, 0.08)";
  } else if (status === "NO") {
    statusEl.className = "status no";
    document.body.style.background = "rgba(220, 38, 38, 0.08)";
  } else {
    statusEl.className = "status";
  }

  noteEl.textContent = note || "";
  updatedEl.textContent = "Last checked: " + new Date().toLocaleTimeString();
}

function parse(csv) {
  return csv.trim().split("\n").slice(1).map(row => {
    const cols = [];
    let current = "";
    let inQuotes = false;

    for (let i = 0; i < row.length; i++) {
      const char = row[i];

      if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        cols.push(current);
        current = "";
      } else {
        current += char;
      }
    }

    cols.push(current);

    const [date, parking, note, weather] = cols;

    return {
      date: date?.trim(),
      parking: parking?.trim(),
      note: note?.trim(),
      weather: weather?.trim()
    };
  });
}

function getForDate(dateStr) {
  const match = cachedData.find(r => r.date === dateStr);
  const weatherEl = document.getElementById("weatherContent");

  // 👇 reset weather visibility on date change
  weatherEl.style.maxHeight = "0px";
  weatherEl.style.opacity = "0";

  if (!match) {
    render("NO DATA", "Ain't no way you actually need to know if there's parking on this day =P");
    weatherEl.textContent = "I haven't written the weather update yet!";
    return;
  }

  render(match.parking, match.note);

  if (match.weather) {
  weatherEl.innerHTML = match.weather.replace(/\r?\n/g, "<br><br>");
  } else {
    weatherEl.textContent = "I haven't written the weather update yet!";
  }
}
  
function toggleWeather() {
  const el = document.getElementById("weatherContent");

  if (el.style.maxHeight && el.style.maxHeight !== "0px") {
    el.style.maxHeight = "0px";
    el.style.opacity = "0";
  } else {
    el.style.maxHeight = el.scrollHeight + "px";
    el.style.opacity = "1";
  }
}
async function load() {
  try {
    render(". . .", "");

    const res = await fetch(SHEET_URL);
    const csv = await res.text();

    cachedData = parse(csv);

    const dateInput = document.getElementById("dateInput");

    // default to today
    dateInput.value = today();

    getForDate(dateInput.value);

    dateInput.addEventListener("change", (e) => {
      getForDate(e.target.value);
    });

  } catch (e) {
  console.error(e);
  // Do nothing — keep last known state
}
}
load();
</script>

</body>
</html>
