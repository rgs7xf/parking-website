<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Can We Park Today?</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f4f4f5;
    }

    .card {
      text-align: center;
      padding: 48px 40px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 340px;
    }

    .title {
      font-size: 14px;
      letter-spacing: 2px;
      color: #666;
      margin-bottom: 20px;
    }

    .status {
      font-size: 72px;
      font-weight: 800;
    }

    .yes { color: #16a34a; }
    .no { color: #dc2626; }

    .note {
      margin-top: 10px;
      color: #444;
      font-size: 14px;
      min-height: 20px;
    }

    .updated {
      margin-top: 18px;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>

<body>
  <div class="card">

    <!-- BODY TITLE (your requested change) -->
    <div class="title">CAN WE PARK TODAY?</div>

    <div id="status" class="status">...</div>
    <div id="note" class="note"></div>
    <div id="updated" class="updated"></div>

  </div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpIOVI52VNw3goax4z00Tj_4QnRsbE8XO5rQgKZ4O04EcwQtNd8u77HAAfoO7ZGY8F03Xtpkh6VzeP/pub?output=csv";

function today() {
  return new Date().toISOString().split("T")[0];
}

function render(status, note) {
  const statusEl = document.getElementById("status");
  const noteEl = document.getElementById("note");
  const updatedEl = document.getElementById("updated");

  statusEl.textContent = status;

  if (status === "YES") {
    statusEl.className = "status yes";
    document.body.style.background = "#ecfdf5";
  } else if (status === "NO") {
    statusEl.className = "status no";
    document.body.style.background = "#fef2f2";
  }

  noteEl.textContent = note || "";
  updatedEl.textContent = "Last checked: " + new Date().toLocaleTimeString();
}

function parse(csv) {
  return csv.trim().split("\n").slice(1).map(r => {
    const [date, parking, note] = r.split(",");
    return { date, parking, note };
  });
}

async function load() {
  try {
    render("LOADING", "");

    const res = await fetch(SHEET_URL);
    const csv = await res.text();

    const rows = parse(csv);
    const t = today();

    const match = rows.find(r => r.date.trim() === t);

    if (!match) {
      render("NO DATA", "No entry for today");
      return;
    }

    render(match.parking.trim(), match.note);

  } catch (e) {
    console.error(e);
    render("ERROR", "Check connection or sheet");
  }
}

load();
</script>

</body>
</html>
