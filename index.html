<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Can We Park Today?</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f4f4f5;
    }

    .card {
      text-align: center;
      padding: 48px 40px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 360px;
    }

    .title {
      font-size: 14px;
      letter-spacing: 2px;
      color: #666;
      margin-bottom: 10px;
    }

    .date-picker {
      margin-bottom: 20px;
    }

    input[type="date"] {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-family: inherit;
    }

    .status {
      font-size: 72px;
      font-weight: 800;
    }

    .yes { color: #16a34a; }
    .no { color: #dc2626; }

    .note {
      margin-top: 10px;
      color: #444;
      font-size: 14px;
      min-height: 20px;
    }

    .updated {
      margin-top: 18px;
      font-size: 11px;
      color: #999;
    }
    
    .disclaimer {
  margin-top: 16px;
  font-size: 10px;
  color: #999;
  line-height: 1.4;
}
  </style>
</head>

<body>
  <div class="card">

    <div class="title">CAN WE PARK TODAY?</div>

    <!-- NEW: date picker -->
    <div class="date-picker">
      <input type="date" id="dateInput"/>
    </div>

    <div id="status" class="status">...</div>
    <div id="note" class="note"></div>
    <div id="updated" class="updated"></div>
    <div class="disclaimer">
  *This website does not guarantee parking. Choosing a future date increases the chance of errors.*
</div>

  </div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpIOVI52VNw3goax4z00Tj_4QnRsbE8XO5rQgKZ4O04EcwQtNd8u77HAAfoO7ZGY8F03Xtpkh6VzeP/pub?output=csv";

let cachedData = [];

function formatDate(d) {
  return d.toISOString().split("T")[0];
}

function today() {
  return formatDate(new Date());
}

function render(status, note) {
  const statusEl = document.getElementById("status");
  const noteEl = document.getElementById("note");
  const updatedEl = document.getElementById("updated");

  statusEl.textContent = status;

  if (status === "YES") {
    statusEl.className = "status yes";
    document.body.style.background = "#ecfdf5";
  } else if (status === "NO") {
    statusEl.className = "status no";
    document.body.style.background = "#fef2f2";
  } else {
    statusEl.className = "status";
  }

  noteEl.textContent = note || "";
  updatedEl.textContent = "Last checked: " + new Date().toLocaleTimeString();
}

function parse(csv) {
  return csv.trim().split("\n").slice(1).map(r => {
    const [date, parking, note] = r.split(",");
    return {
      date: date?.trim(),
      parking: parking?.trim(),
      note: note?.trim()
    };
  });
}

function getForDate(dateStr) {
  const match = cachedData.find(r => r.date === dateStr);

  if (!match) {
    render("NO DATA", "No entry for selected date");
    return;
  }

  render(match.parking, match.note);
}

async function load() {
  try {
    render("LOADING", "");

    const res = await fetch(SHEET_URL);
    const csv = await res.text();

    cachedData = parse(csv);

    const dateInput = document.getElementById("dateInput");

    // default to today
    dateInput.value = today();

    getForDate(dateInput.value);

    dateInput.addEventListener("change", (e) => {
      getForDate(e.target.value);
    });

  } catch (e) {
    console.error(e);
    render("ERROR", "Could not load data");
  }
}

load();
</script>

</body>
</html>
